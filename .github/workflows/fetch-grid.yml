name: DDF Grid Sync (manual fallback only)

# Schedule removed — ddf-sync.js fully covers the grid table.
# Kept as a manual fallback via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run DDF Grid fetch script
        run: node fetch-grid.js
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DDF_CLIENT_ID: ${{ secrets.DDF_CLIENT_ID }}
          DDF_CLIENT_SECRET: ${{ secrets.DDF_CLIENT_SECRET }}
