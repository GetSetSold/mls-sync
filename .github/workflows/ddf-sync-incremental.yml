name: DDF Incremental Sync
on:
  schedule:
    - cron: '0 11,16,21,1 * * *'  # 7am, 12pm, 5pm, 9pm EDT (UTC-4)
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run incremental DDF sync
        run: node ddf-sync-v2.js
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DDF_CLIENT_ID: ${{ secrets.DDF_CLIENT_ID }}
          DDF_CLIENT_SECRET: ${{ secrets.DDF_CLIENT_SECRET }}
          FULL_SYNC: 'false'
      # Refresh the pre-computed stats tables (hood_stats, city_stats) right
      # after the data changes, so city/hood pages read one indexed row
      # instead of aggregating. Runs only if the sync above succeeded; the
      # site falls back to the RPCs if this step ever fails.
      - name: Refresh pre-computed stats tables
        run: node update-stats.js
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
